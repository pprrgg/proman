</style></head> <body> <header> <a class="brand" href="/"><span aria-hidden="true">⚡</span><span>Vatio</span><span class="libre">Libre</span></a> <a class="back" href="/">← Volver al blog</a> </header> <section class="intro"> <h1>Comunidades energéticas en España</h1> <p>Mapa de comunidades energéticas de ejemplo (ficticias). Pulsa una para entrar en su plataforma.</p> <div class="stats"> <span><strong>28</strong> comunidades</span> <span><strong>1029</strong> socios</span> <span><strong>9627</strong> kW instalados</span> </div> <div class="legend" aria-label="Leyenda"> <span><i class="dot" style="background: var(--solar)"></i>Solar</span> <span><i class="dot" style="background: var(--eolica)"></i>Eólica</span> <span><i class="dot" style="background: var(--mixta)"></i>Mixta</span> </div> </section> <div class="map-wrap"> <div id="mapa" role="region" aria-label="Mapa de comunidades energéticas"></div> <div id="canarias" role="region" aria-label="Canarias"></div> </div> <noscript>El mapa necesita JavaScript. <a href="/">Volver al blog</a>.</noscript> <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Plataforma de la comunidad energética"> <iframe id="visorFrame" title="Plataforma de la comunidad energética" allow="fullscreen; clipboard-write"></iframe> </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script> <script>(function(){const comunidades = [{"nombre":"Comunidad Energética Churriana","municipio":"Churriana","provincia":"Málaga","lat":36.6652,"lon":-4.4983,"socios":7,"kwp":152,"tipo":"Mixta"},{"nombre":"Sol de Tabernas","municipio":"Tabernas","provincia":"Almería","lat":37.0496,"lon":-2.3903,"socios":42,"kwp":310,"tipo":"Solar"},{"nombre":"Vega Viva","municipio":"Santa Fe","provincia":"Granada","lat":37.1889,"lon":-3.7186,"socios":28,"kwp":185,"tipo":"Solar"},{"nombre":"Aljarafe Renovable","municipio":"Mairena del Aljarafe","provincia":"Sevilla","lat":37.3447,"lon":-6.0628,"socios":64,"kwp":420,"tipo":"Solar"},{"nombre":"Viento de Tarifa","municipio":"Tarifa","provincia":"Cádiz","lat":36.0143,"lon":-5.6044,"socios":35,"kwp":600,"tipo":"Eólica"},{"nombre":"Campiña Solar","municipio":"Écija","provincia":"Sevilla","lat":37.5422,"lon":-5.0826,"socios":22,"kwp":160,"tipo":"Solar"},{"nombre":"Huerta Energética","municipio":"Alzira","provincia":"Valencia","lat":39.1514,"lon":-0.4356,"socios":51,"kwp":280,"tipo":"Solar"},{"nombre":"Mar Menor Sostenible","municipio":"San Javier","provincia":"Murcia","lat":37.8063,"lon":-0.8374,"socios":39,"kwp":260,"tipo":"Solar"},{"nombre":"Montes de Toledo Energía","municipio":"Los Yébenes","provincia":"Toledo","lat":39.5822,"lon":-3.873,"socios":18,"kwp":220,"tipo":"Mixta"},{"nombre":"Barrio Solar Vallecas","municipio":"Madrid","provincia":"Madrid","lat":40.3845,"lon":-3.6585,"socios":120,"kwp":540,"tipo":"Solar"},{"nombre":"Sierra Norte Renovable","municipio":"Buitrago del Lozoya","provincia":"Madrid","lat":40.9928,"lon":-3.6386,"socios":26,"kwp":140,"tipo":"Mixta"},{"nombre":"La Mancha Eólica","municipio":"Campo de Criptana","provincia":"Ciudad Real","lat":39.4049,"lon":-3.1246,"socios":33,"kwp":750,"tipo":"Eólica"},{"nombre":"Dehesa Viva","municipio":"Zafra","provincia":"Badajoz","lat":38.4245,"lon":-6.4176,"socios":24,"kwp":190,"tipo":"Solar"},{"nombre":"Tierra de Campos Energía","municipio":"Medina de Rioseco","provincia":"Valladolid","lat":41.8826,"lon":-5.0429,"socios":19,"kwp":330,"tipo":"Mixta"},{"nombre":"Páramo Eólico","municipio":"Villadiego","provincia":"Burgos","lat":42.5157,"lon":-4.0101,"socios":15,"kwp":480,"tipo":"Eólica"},{"nombre":"Moncayo Renovable","municipio":"Tarazona","provincia":"Zaragoza","lat":41.905,"lon":-1.7253,"socios":30,"kwp":520,"tipo":"Eólica"},{"nombre":"Delta Energètic","municipio":"Deltebre","provincia":"Tarragona","lat":40.7203,"lon":0.7106,"socios":27,"kwp":210,"tipo":"Solar"},{"nombre":"Gràcia Solar","municipio":"Barcelona","provincia":"Barcelona","lat":41.4036,"lon":2.157,"socios":95,"kwp":380,"tipo":"Solar"},{"nombre":"Empordà Renovable","municipio":"Figueres","provincia":"Girona","lat":42.2667,"lon":2.9617,"socios":36,"kwp":410,"tipo":"Mixta"},{"nombre":"Navarra Comunal","municipio":"Tafalla","provincia":"Navarra","lat":42.528,"lon":-1.6737,"socios":44,"kwp":560,"tipo":"Mixta"},{"nombre":"Rioja Alta Energía","municipio":"Haro","provincia":"La Rioja","lat":42.577,"lon":-2.8466,"socios":21,"kwp":175,"tipo":"Solar"},{"nombre":"Urdaibai Energia","municipio":"Gernika","provincia":"Bizkaia","lat":43.317,"lon":-2.678,"socios":38,"kwp":230,"tipo":"Mixta"},{"nombre":"Picos Verdes","municipio":"Cangas de Onís","provincia":"Asturias","lat":43.3512,"lon":-5.129,"socios":17,"kwp":120,"tipo":"Mixta"},{"nombre":"Costa da Morte Eólica","municipio":"Malpica de Bergantiños","provincia":"A Coruña","lat":43.3226,"lon":-8.8106,"socios":29,"kwp":690,"tipo":"Eólica"},{"nombre":"Ribeira Sacra Solar","municipio":"Monforte de Lemos","provincia":"Lugo","lat":42.5214,"lon":-7.5146,"socios":16,"kwp":115,"tipo":"Solar"},{"nombre":"Illa Solar","municipio":"Inca","provincia":"Illes Balears","lat":39.721,"lon":2.911,"socios":47,"kwp":300,"tipo":"Solar"},{"nombre":"Alisios Comunidad","municipio":"Telde","provincia":"Las Palmas","lat":27.9924,"lon":-15.4192,"socios":52,"kwp":640,"tipo":"Mixta"},{"nombre":"Teide Renovable","municipio":"La Orotava","provincia":"Santa Cruz de Tenerife","lat":28.3907,"lon":-16.523,"socios":34,"kwp":260,"tipo":"Solar"}];

      const COLOR = { Solar: '#f5a623', 'Eólica': '#29b6f6', Mixta: '#2e9d6b' };
      const DESTINO = 'https://vatiolibre.duckdns.org/';   // plataforma de la comunidad (ThingsBoard)

      // Visor a pantalla completa: la plataforma en un iframe sobre el mapa, sin barra.
      // Se cierra con "atras" del navegador (o Esc mientras el foco no este en el iframe).
      const visor = document.getElementById('visor');
      const visorFrame = document.getElementById('visorFrame');
      let foco = null;
      function abrir(c) {
        visorFrame.title = c.nombre;
        if (visorFrame.getAttribute('src') !== DESTINO) visorFrame.src = DESTINO;
        foco = document.activeElement;
        visor.classList.add('abierto');
        document.body.style.overflow = 'hidden';
        visorFrame.focus();
        if (location.hash !== '#plataforma') history.pushState({ visor: true }, '', '#plataforma');
      }
      function cerrar() {
        if (!visor.classList.contains('abierto')) return;
        visor.classList.remove('abierto');
        document.body.style.overflow = '';
        if (foco) foco.focus();
      }
      const salir = () => (location.hash === '#plataforma' ? history.back() : cerrar());
      window.addEventListener('popstate', cerrar);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && visor.classList.contains('abierto')) salir();
      });
      if (location.hash === '#plataforma') history.replaceState(null, '', location.pathname);

      // Teselas de OpenStreetMap, oscurecidas con CSS (.mapa-oscuro) para el tema del sitio
      const capa = () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        className: 'mapa-oscuro',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      });
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      // Marcadores de las comunidades de 'lista' en el mapa 'm'; al pulsar, a la plataforma
      function marcar(m, lista) {
        for (const c of lista) {
          const icono = L.divIcon({
            className: '',
            html: `<div class="ce-marker" style="background:${COLOR[c.tipo]}" role="link" aria-label="${esc(c.nombre)}">⚡</div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17],
          });
          const mk = L.marker([c.lat, c.lon], { icon: icono, title: c.nombre, keyboard: true }).addTo(m);
          mk.bindTooltip(
            `<b>${esc(c.nombre)}</b><br><small>${esc(c.municipio)} · ${esc(c.provincia)}</small><br>` +
              `${c.socios} socios · ${c.kwp.toLocaleString('es-ES')} kW · ${esc(c.tipo)}`,
            { className: 'ce-tip', direction: 'top', offset: [0, -16] },
          );
          mk.on('click keypress', () => abrir(c));
        }
      }

      const enCanarias = (c) => c.lat < 30;
      const peninsula = comunidades.filter((c) => !enCanarias(c));
      const canarias = comunidades.filter(enCanarias);

      // Mapa principal: peninsula y Baleares
      const mapa = L.map('mapa', { zoomSnap: 0.25 });
      capa().addTo(mapa);
      marcar(mapa, peninsula);
      mapa.fitBounds(L.latLngBounds(peninsula.map((c) => [c.lat, c.lon])).pad(0.08));

      // Recuadro de Canarias, fijo
      const recuadro = L.map('canarias', {
        zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
        doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, zoomSnap: 0.25,
      });
      capa().addTo(recuadro);
      marcar(recuadro, canarias);
      recuadro.fitBounds([[27.6, -18.2], [29.45, -13.3]]);
    })();</script> </body> </html>
